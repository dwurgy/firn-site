<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firn</title>
<meta name="description" content="A calm, minimalist browser with vertical tabs, spaces, and split view. Now available for Mac.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Firn">
<meta property="og:url" content="https://firnbrowser.com/">
<meta property="og:title" content="Firn">
<meta property="og:description" content="A calm, minimalist browser with vertical tabs, spaces, and split view. Now available for Mac.">
<meta property="og:image" content="https://firnbrowser.com/assets/firn-share-preview-v10.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Firn logo, out of focus on a dark blue sky, above the words: A calm browser for Mac, iPhone, and iPad.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Firn">
<meta name="twitter:description" content="A calm, minimalist browser with vertical tabs, spaces, and split view. Now available for Mac.">
<meta name="twitter:image" content="https://firnbrowser.com/assets/firn-share-preview-v10.png">

<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon/firn-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon/firn-favicon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#D3DBDF" media="(prefers-color-scheme: light) and (max-width: 600px)">
<meta name="theme-color" content="#151A27" media="(prefers-color-scheme: dark) and (max-width: 600px)">
<meta name="theme-color" content="#D3DBDF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A27" media="(prefers-color-scheme: dark)">

<link rel="preload" href="https://fonts.firnbrowser.com/GooperDeck-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://fonts.firnbrowser.com/GooperDeck-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="home.css?v=27">
<script src="home.js?v=13" defer></script>
</head>
<body>
<main class="page" id="page">

<!-- The logo, out of focus -->
<div class="soft" aria-hidden="true">
<picture>
<source media="(prefers-color-scheme: dark)" srcset="assets/firn-lockup-on-dark.svg">
<img class="logo" src="assets/firn-lockup.svg" alt="" width="5353" height="2595">
</picture>
</div>

<!-- The strip along the bottom: the line and links on the left, the download on the right -->
<div class="strip" id="strip">
<div>
<h1>A calm browser <span class="em">for Mac, iPhone, and iPad.</span></h1>
<nav aria-label="More about Firn">
<a href="/privacy">Privacy</a>
<a href="/release-notes">Release notes</a>
<a href="/tip-jar">Tip jar</a>
</nav>
</div>
<div>
<!-- On a Mac or any computer (and when JavaScript is off) -->
<div class="get" id="get-mac">
<a class="pill" href="https://github.com/dwurgy/firn/releases/latest/download/Firn.dmg">Download</a>
<p class="small">Free. Needs macOS 14 or later.</p>
</div>
<!-- On an iPhone or iPad, once APP_STORE_URL is filled in at the top of home.js -->
<div class="get" id="get-ios" hidden>
<a class="pill" id="app-store-link" href="/">Download</a>
<p class="small">On the App Store.</p>
</div>
<!-- On an iPhone or iPad, until then -->
<p class="small" id="get-soon" hidden>Firn is on the Mac today.<br>iPhone and iPad are on the way.</p>
</div>
</div>

<!-- The same page in focus; only the part under the lens shows -->
<div class="sharp">
<picture>
<source media="(prefers-color-scheme: dark)" srcset="assets/firn-lockup-on-dark.svg">
<img class="logo" src="assets/firn-lockup.svg" alt="Firn" width="5353" height="2595">
</picture>
<div class="mirror" id="mirror" aria-hidden="true" inert></div>
</div>

<canvas class="snow" id="snow" aria-hidden="true"></canvas>
<div class="ring" aria-hidden="true"><i></i></div>

</main>
</body>
</html>
