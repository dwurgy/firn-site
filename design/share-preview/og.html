<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Gooper Deck";src:url(GooperDeck-Regular.woff2);font-weight:400}
@font-face{font-family:"Gooper Deck";src:url(GooperDeck-SemiBold.woff2);font-weight:600}
html,body{margin:0}
/* Sunrise (home): blue hour at the top, warming to dawn at the horizon. */
.c{position:relative;width:1200px;height:630px;overflow:hidden;
 background:linear-gradient(180deg,#1C2130 0px,#252C3E 160px,#343E57 290px,#556079 370px,#8D8C9E 420px,#CDB8B4 460px,#EAD3C5 500px,#F4E5DA 560px)}
.glow{position:absolute;left:744px;top:470px;width:900px;height:620px;margin:-310px 0 0 -450px;border-radius:50%;

.disc{position:absolute;left:744px;top:470px;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;

.snow{position:absolute;left:0;bottom:0;width:1200px;height:270px;background:url(snow-noflakes.svg) center bottom/1350px auto no-repeat}
.logo{position:absolute;top:96px;left:50%;transform:translateX(-50%);height:80px}
h1{position:absolute;top:200px;width:100%;margin:0;text-align:center;font:400 50px/1.1 "Gooper Deck",Georgia,serif;color:#F5F1EC;letter-spacing:-.005em}
h1 b{font-weight:600}
.u{position:absolute;top:280px;width:100%;text-align:center;font:400 22px system-ui,-apple-system,"Segoe UI",sans-serif;color:#D4CDC5}
.f{position:absolute;opacity:.22;filter:brightness(0) invert(1)}
</style></head><body><div class="c">
